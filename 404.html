<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · HodoGuides</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/images/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{ --ink:#f5f7fc; --ink-2:#c3c9d9; --accent:#8fa0c8; }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
      font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
      background:#0e1420 radial-gradient(ellipse at 50% 35%, #1d2845 0%, #0e1420 60%, #0b0f18 100%);
      text-align:center;
    }
    .box{max-width:460px; display:grid; gap:18px; justify-items:center}
    .brand{font-family:"DM Serif Display",Georgia,serif; font-size:22px; color:var(--ink-2); text-decoration:none}
    .emoji{font-size:54px; line-height:1}
    h1{margin:0; font-family:"DM Serif Display",Georgia,serif; font-weight:400; font-size:34px; line-height:1.15}
    p{margin:0; color:var(--ink-2); line-height:1.6; font-size:16px}
    .btn{
      display:inline-flex; align-items:center; gap:8px; height:48px; padding:0 22px; border-radius:999px;
      background:var(--ink); color:#0e1420; font-weight:700; text-decoration:none; margin-top:6px;
    }
    .alt{font-size:14px; color:var(--ink-2)}
    .alt a{color:var(--ink)}
  </style>
</head>
<body>
  <main class="box">
    <a class="brand" href="/">HodoGuides</a>
    <div class="emoji">🧭</div>
    <h1 data-t="title"></h1>
    <p data-t="text"></p>
    <a class="btn" href="/" data-t="back"></a>
    <p class="alt"><span data-t="planner"></span> <a href="https://planner.erikaramel.com/" target="_blank" rel="noopener">HodoPlanner →</a></p>
  </main>
  <script>
    const T = {
      "fr": {
        "title": "Ce chemin ne mène nulle part… pour l'instant",
        "text": "Cette page n'existe pas ou le guide n'est pas encore prêt. Je publie de nouveaux lieux régulièrement !",
        "back": "← Retour à la carte",
        "planner": "Tu prépares un voyage ?"
      },
      "en": {
        "title": "This path leads nowhere… for now",
        "text": "This page doesn't exist or the guide isn't ready yet. I publish new places regularly!",
        "back": "← Back to the map",
        "planner": "Planning a trip?"
      }
    };
    let lang = "en";
    try { lang = localStorage.getItem("hodo-lang") || ""; } catch (_) {}
    if (lang !== "fr" && lang !== "en") lang = (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
  </script>
</body>
</html>
