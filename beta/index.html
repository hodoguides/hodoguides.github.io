<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-fr="HodoGuides · bêta" data-en="HodoGuides · beta">HodoGuides · bêta</title>
  <meta name="description" content="Bêta de la nouvelle version de HodoGuides." />
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="HodoGuides by Erika" />
  <meta property="og:description" content="Les adresses que j'ai vraiment testées, sur une carte. · The places I've actually been to, on a map." />
  <meta property="og:image" content="https://guides.erikaramel.com/asia/japan/cover.jpg" />
  <link rel="icon" href="/images/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="/beta/assets/kawaii.css" />
  <link rel="stylesheet" href="/beta/assets/app.css" />
</head>
<body class="app" data-view="world">

  <div id="map" aria-label="Map"></div>

  <!-- Always visible -->
  <header class="bar">
    <a class="brand chip-brand" href="/beta/" data-go="world"><span data-mascot="28"></span><b>HodoGuides</b></a>
    <div class="bar-actions">
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="square" id="searchBtn" data-fr="Rechercher" data-en="Search">🔍</button>
    </div>
  </header>

  <!-- World view (proposal C) -->
  <section class="intro" data-only="world">
    <span class="kicker"><span data-l="fr">Carnet de voyage · by Erika</span><span data-l="en">Travel journal · by Erika</span></span>
    <h1><span data-l="fr">Clique sur un pays pour voir mes adresses testées</span><span data-l="en">Tap a country to see the places I've tried</span></h1>
  </section>
  <div class="world-foot" data-only="world">
    <span class="pill strong"><span class="lg-ready"></span><span data-l="fr">Guide prêt</span><span data-l="en">Guide ready</span></span>
    <span class="pill strong"><span class="lg-soon"></span><span data-l="fr">Bientôt</span><span data-l="en">Coming soon</span></span>
    <button type="button" class="btn small" id="exploreBtn">☰ <span data-l="fr">Guides & pays</span><span data-l="en">Guides & countries</span></button>
  </div>
  <div class="wm-pop" id="worldCard" hidden></div>

  <!-- Country view (proposal A) -->
  <div class="country-bar" data-only="country">
    <button type="button" class="btn small" data-go="world">← <span data-l="fr">Monde</span><span data-l="en">World</span></button>
  </div>

  <!-- Bottom panel (side panel on desktop): country list, place sheet, explore, search -->
  <aside class="panel" id="panel" data-size="closed" aria-hidden="true">
    <button type="button" class="grip" id="grip" data-fr="Agrandir ou réduire" data-en="Expand or collapse"><span></span></button>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <p class="beta-tag"><span data-l="fr">Bêta · textes d'exemple</span><span data-l="en">Beta · sample texts</span></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <script src="/beta/assets/icons.js"></script>
  <script src="/beta/assets/common.js"></script>
  <script src="/beta/assets/app.js"></script>
</body>
</html>
